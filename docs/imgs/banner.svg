<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="GEAP Tuning — working examples of Gemini Enterprise Agent Platform model tuning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1a1440"/>
      <stop offset="1" stop-color="#3b1a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#8E75B2"/>
      <stop offset="1" stop-color="#DE5FE9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="1120" cy="60" r="3"/>
    <circle cx="1170" cy="60" r="3"/>
    <circle cx="1220" cy="60" r="3"/>
    <circle cx="1120" cy="110" r="3"/>
    <circle cx="1170" cy="110" r="3"/>
    <circle cx="1220" cy="110" r="3"/>
    <circle cx="1120" cy="160" r="3"/>
    <circle cx="1170" cy="160" r="3"/>
    <circle cx="1220" cy="160" r="3"/>
  </g>

  <!-- accent bar -->
  <rect x="96" y="96" width="72" height="8" rx="4" fill="url(#accent)"/>

  <text x="96" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="url(#title)">GEAP Tuning</text>

  <text x="98" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#b9c2e0">Working, runnable examples of Gemini Enterprise Agent Platform model tuning</text>

  <text x="98" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#7f8bb5" letter-spacing="0.5">Supervised fine-tuning (SFT)  ·  Preference tuning (DPO)  ·  Reinforcement learning fine-tuning (RLFT)</text>
</svg>
