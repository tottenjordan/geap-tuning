[project]
name = "geap-tuning"
version = "0.1.0"
description = "Working examples of Gemini Enterprise Agent Platform (GEAP) model tuning services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-aiplatform>=1.162.0",
    "google-cloud-storage>=3.13.0",
    "google-genai>=2.14.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
]

[project.scripts]
geap-tuning = "geap_tuning:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = [
    "ruff",
    "ty",
]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
test = [
    "pytest",
    "pytest-cov",
]
vision = [
    "kagglehub>=1.0.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
# D: docstring rules, COM812: formatter-managed commas,
# CPY001: copyright headers, T201: print() is fine in runnable examples.
ignore = ["D", "COM812", "CPY001", "T201"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are expected in tests; PLR2004: literal comparisons are normal in assertions.
"tests/**" = ["S101", "PLR2004"]
# INP001: examples/ is a directory of runnable scripts, not an importable package.
"examples/**" = ["INP001"]

[tool.pytest.ini_options]
addopts = "--cov=geap_tuning --cov-report=term-missing"
testpaths = ["tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.12"
