name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref so a push burst costs one run, not five.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # No setup-python step: uv reads .python-version (3.12) and installs it.
      - run: uv sync --all-groups
      - run: make lint
      - run: make test
