name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref so a push burst costs one run, not five.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact version on purpose: astral-sh/setup-uv stopped
      # publishing floating major tags after v7, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # No setup-python step: uv reads .python-version (3.12) and installs it.
      - run: uv sync --all-groups
      - run: make lint
      - run: make test
      # Tripwire: fail if a dependency bump starts deprecating a surface we use.
      # vertexai.Client is already deprecated in favour of agentplatform.Client
      # (aiplatform 2.1.0); these are the surfaces this repo actually depends on.
      # Kept as a CI step rather than a pytest test on purpose: as a test it would
      # have to import the real aiplatform module (~4.3s), undoing the lazy import
      # in experiments.py.
      - name: No deprecation warnings on the SDK surfaces we use
        run: |
          uv run python -W error::FutureWarning -W error::DeprecationWarning -c "
          from google.cloud import aiplatform
          for n in ('init','start_run','log_params','log_metrics',
                    'log_time_series_metrics','Experiment','Tensorboard'):
              getattr(aiplatform, n)
          from google import genai
          genai.Client(vertexai=True, project='p', location='us-central1')
          print('no deprecation warnings on the surfaces this repo uses')
          "
